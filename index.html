<style>
  /* ============================================================
     CorroHealth Tools Hub
     Brand palette (from CorroColors):
       Eminence Purple  #512e6e   (primary)
       Deep Magenta     #5e174d   (secondary)
       Gold             #e7b524   (accent)
       Logo gradient    lime -> teal -> purple
     ============================================================ */

  :root {
    --brand-purple: #512e6e;
    --brand-magenta: #5e174d;
    --brand-gold: #e7b524;
    --grad-lime: #9ccb3b;
    --grad-teal: #35b6b6;
    --grad-purple: #5b2d86;
  }

  html[data-theme="dark"] {
    --bg: #140d1e;
    --bg-glow: #1e1230;
    --surface: #1e1630;
    --surface-2: #251b3a;
    --surface-hover: #2b2044;
    --border: #342747;
    --border-soft: #2a2040;
    --text: #f3eefb;
    --text-muted: #a99cc0;
    --text-faint: #7d7196;
    --btn-face: #2a1f42;
    --logo-word: #ffffff;
    --title-gold: #e7b524;
    --title-fill: #ffffff;
  }

  html[data-theme="light"] {
    --bg: #f6f3fa;
    --bg-glow: #efe8f6;
    --surface: #ffffff;
    --surface-2: #faf7fd;
    --surface-hover: #f3eef9;
    --border: #e4dcef;
    --border-soft: #ece5f4;
    --text: #241633;
    --text-muted: #6a5c80;
    --text-faint: #948aa6;
    --btn-face: #ffffff;
    --logo-word: #241633;
    --title-gold: #9a6f0a;
    --title-fill: #0d0d0d;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Inter', system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
    position: relative;
    overflow-x: hidden;
    transition: background .35s ease, color .35s ease;
  }

  /* Ambient brand ripple behind the hero — the CorroHealth arc motif */
  .ambient {
    position: fixed;
    top: -220px; left: 50%;
    transform: translateX(-50%);
    width: 1100px; height: 700px;
    pointer-events: none; z-index: 0;
    opacity: .5;
  }
  html[data-theme="light"] .ambient { opacity: .35; }

  .shell { position: relative; z-index: 1; max-width: 1180px; margin: 0 auto; padding: 0 28px; }

  /* ---------- Top bar ---------- */
  header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 22px 0 26px;
  }
  .brand { display: flex; align-items: center; gap: 13px; }
  .brand-logo { height: 30px; width: auto; display: block; flex-shrink: 0; }
  .brand .tag {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10.5px; letter-spacing: .06em; text-transform: uppercase;
    color: var(--text-muted);
    border: 1px solid var(--border);
    padding: 3px 8px; border-radius: 6px;
  }

  .top-actions { display: flex; align-items: center; gap: 10px; }
  .icon-btn {
    width: 38px; height: 38px; border-radius: 9px;
    border: 1px solid var(--border);
    background: var(--btn-face);
    color: var(--text-muted);
    display: grid; place-items: center; cursor: pointer;
    transition: all .2s ease;
  }
  .icon-btn:hover { color: var(--text); border-color: var(--brand-gold); }
  .signin {
    display: inline-flex; align-items: center; gap: 9px;
    font-family: 'Inter', sans-serif; font-size: 14px; font-weight: 500;
    color: #fff;
    background: linear-gradient(135deg, var(--brand-purple), var(--brand-magenta));
    border: none; padding: 10px 18px; border-radius: 9px; cursor: pointer;
    transition: transform .15s ease, box-shadow .2s ease;
    box-shadow: 0 4px 18px -6px rgba(81,46,110,.7);
  }
  .signin:hover { transform: translateY(-1px); box-shadow: 0 8px 24px -6px rgba(81,46,110,.85); }
  .signin svg { width: 16px; height: 16px; }
  .signin.loading { opacity: .7; pointer-events: none; }

  .account-chip {
    display: flex; align-items: center; gap: 9px;
    border: 1px solid var(--border); background: var(--btn-face);
    border-radius: 9px; padding: 5px 8px 5px 6px;
  }
  .acct-initials {
    width: 26px; height: 26px; border-radius: 7px; flex-shrink: 0;
    display: grid; place-items: center;
    font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 500; color: #fff;
    background: linear-gradient(135deg, var(--brand-purple), var(--brand-magenta));
  }
  .acct-name {
    font-size: 13px; color: var(--text); max-width: 150px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .acct-signout {
    background: none; border: none; cursor: pointer; color: var(--text-faint);
    display: grid; place-items: center; padding: 3px; border-radius: 6px;
  }
  .acct-signout:hover { color: var(--brand-gold); }

  /* ---------- Hero ---------- */
  .hero {
    display: flex; align-items: flex-end; justify-content: space-between;
    gap: 30px; padding: 30px 0 46px;
    border-bottom: 1px solid var(--border-soft);
    flex-wrap: wrap;
  }
  .hero h1 {
    font-family: 'Space Grotesk', sans-serif;
    font-size: clamp(34px, 5vw, 52px); font-weight: 600;
    letter-spacing: -0.025em; line-height: 1.02;
    color: var(--title-fill);
    -webkit-text-stroke: 0.8px #e7b524;
    text-stroke: 0.8px #e7b524;
    paint-order: stroke fill;
  }
  .hero h1 .accent { color: inherit; }
  .hero p {
    color: var(--text-muted); font-size: 15px; max-width: 560px; margin-top: 14px;
  }
  .counter {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12.5px; color: var(--text-muted);
    border: 1px solid var(--border);
    border-radius: 999px; padding: 8px 15px;
    display: inline-flex; align-items: center; gap: 9px;
    white-space: nowrap; background: var(--surface);
  }
  .counter .live-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--grad-lime); box-shadow: 0 0 0 3px rgba(156,203,59,.18); }

  /* ---------- Sections ---------- */
  .section { padding: 40px 0 4px; }
  .eyebrow {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px; letter-spacing: .22em; text-transform: uppercase;
    color: var(--text-faint); margin-bottom: 20px;
    display: flex; align-items: center; gap: 12px;
  }
  .eyebrow::after { content: ""; flex: 1; height: 1px; background: var(--border-soft); }

  .grid {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px;
  }

  /* ---------- Tool card ---------- */
  .card {
    position: relative;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px; padding: 22px 22px 18px;
    cursor: pointer; text-decoration: none; color: inherit;
    display: flex; flex-direction: column; min-height: 176px;
    transition: transform .18s ease, border-color .18s ease, background .18s ease;
    overflow: hidden;
  }
  .card::before {
    content: ""; position: absolute; inset: 0;
    background: radial-gradient(420px 160px at 100% 0%, rgba(231,181,36,.07), transparent 60%);
    opacity: 0; transition: opacity .25s ease;
  }
  .card:hover { transform: translateY(-3px); border-color: var(--brand-gold); background: var(--surface-hover); }
  .card:hover::before { opacity: 1; }
  .card:focus-visible { outline: 2px solid var(--brand-gold); outline-offset: 2px; }
  .card.locked { cursor: default; opacity: .6; }
  .card.locked:hover { transform: none; border-color: var(--border); background: var(--surface); }
  .card.locked:hover::before { opacity: 0; }

  .card .ico {
    width: 44px; height: 44px; border-radius: 12px;
    display: grid; place-items: center; margin-bottom: 16px;
    color: #fff;
  }
  .card .ico svg { width: 22px; height: 22px; }
  .card h3 {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 17px; font-weight: 600; letter-spacing: -0.01em; margin-bottom: 8px;
  }
  .card p { font-size: 13px; color: var(--text-muted); line-height: 1.55; flex: 1; }

  .card .foot {
    display: flex; align-items: center; justify-content: space-between;
    margin-top: 16px;
  }
  .lock { color: var(--text-faint); display: inline-flex; }
  .lock svg { width: 15px; height: 15px; }
  .status {
    font-family: 'JetBrains Mono', monospace; font-size: 11px;
    display: inline-flex; align-items: center; gap: 6px; letter-spacing: .02em;
    margin-left: auto;
  }
  .status .dot { width: 6px; height: 6px; border-radius: 50%; }
  .status.live { color: var(--grad-lime); }
  .status.live .dot { background: var(--grad-lime); }
  .status.updating { color: #f0b429; }
  .status.updating .dot { background: #f0b429; }
  .status.down { color: #ef5a5a; }
  .status.down .dot { background: #ef5a5a; }
  .status.beta { color: #b79ad6; }
  .status.beta .dot { background: #b79ad6; }
  .status.soon { color: var(--text-faint); }
  .status.soon .dot { background: var(--text-faint); }

  /* icon tints */
  .t-purple { background: linear-gradient(135deg, #6b3d92, #512e6e); }
  .t-magenta{ background: linear-gradient(135deg, #7a2263, #5e174d); }
  .t-gold   { background: linear-gradient(135deg, #f0c94b, #cf9e15); color:#3a2b04 !important; }
  .t-plum   { background: linear-gradient(135deg, #9a5fbf, #6b3d92); }
  .t-wine   { background: linear-gradient(135deg, #a2356f, #6d1a52); }
  .t-brand  { background: linear-gradient(135deg, var(--grad-lime), var(--grad-teal) 55%, var(--brand-purple)); }

  /* ---------- Access notice ---------- */
  .notice {
    display: flex; align-items: center; gap: 11px;
    margin: 30px 0 4px; padding: 14px 18px;
    border: 1px solid var(--border);
    border-left: 3px solid var(--brand-gold);
    border-radius: 12px;
    background: var(--surface);
    color: var(--text-muted); font-size: 14px;
  }
  .notice svg { color: var(--brand-gold); flex-shrink: 0; }
  .notice strong { color: var(--text); font-weight: 600; }

  /* ---------- Empty state ---------- */
  .empty {
    border: 1px dashed var(--border);
    border-radius: 16px;
    padding: 52px 28px; text-align: center;
    background: var(--surface);
  }
  .empty svg { width: 40px; height: 40px; color: var(--text-faint); margin-bottom: 16px; }
  .empty h3 {
    font-family: 'Space Grotesk', sans-serif; font-size: 18px; font-weight: 600;
    margin-bottom: 8px;
  }
  .empty p { color: var(--text-muted); font-size: 14px; max-width: 380px; margin: 0 auto; }
  .empty code {
    font-family: 'JetBrains Mono', monospace; font-size: 12.5px;
    background: var(--surface-2); border: 1px solid var(--border-soft);
    padding: 2px 6px; border-radius: 5px; color: var(--brand-gold);
  }

  /* ---------- Setup / footer strip ---------- */
  .setup {
    margin: 46px 0 30px; background: var(--surface);
    border: 1px solid var(--border); border-radius: 16px; overflow: hidden;
  }
  .setup summary {
    list-style: none; cursor: pointer; padding: 18px 22px;
    display: flex; align-items: center; gap: 11px;
    font-family: 'Space Grotesk', sans-serif; font-weight: 600; font-size: 15px;
  }
  .setup summary::-webkit-details-marker { display: none; }
  .setup summary .chev { margin-left: auto; color: var(--text-faint); transition: transform .2s ease; }
  .setup[open] summary .chev { transform: rotate(180deg); }
  .setup .body { padding: 0 22px 22px; color: var(--text-muted); font-size: 14px; }
  .setup .body code {
    font-family: 'JetBrains Mono', monospace; font-size: 12.5px;
    background: var(--surface-2); border: 1px solid var(--border-soft);
    padding: 2px 6px; border-radius: 5px; color: var(--brand-gold);
  }
  .setup .body ol { margin: 10px 0 0 18px; display: grid; gap: 8px; }

  footer {
    text-align: center; color: var(--text-faint); font-size: 12.5px;
    padding: 24px 0 42px;
    font-family: 'JetBrains Mono', monospace;
  }

  /* ---------- Responsive ---------- */
  @media (max-width: 900px) { .grid { grid-template-columns: repeat(2, 1fr); } }
  @media (max-width: 620px) {
    .shell { padding: 0 18px; }
    .grid { grid-template-columns: 1fr; }
    .brand-text .tag { display: none; }
    .signin span { display: none; }
    .hero { padding-bottom: 34px; }
  }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; animation: none !important; }
  }
</style>
</head>

<script>
/* ============================================================
   EDIT YOUR TOOLS HERE
   ------------------------------------------------------------
   section : group heading (shown as an eyebrow label)
   name    : tool title
   desc    : one-to-two sentence description
   icon    : key from ICONS below
   tint    : t-purple | t-magenta | t-gold | t-plum | t-wine | t-brand
   status  : 'live' | 'updating' | 'down' | 'beta' | 'soon'
             (green = live, amber = updating, red = down, lavender = beta, grey = soon)
   auth    : true  -> shows a lock (sign-in required)
   url     : link the card points to (default '#')
   ============================================================ */

// Hub version — bump this string whenever you ship a change (shown in the footer).
const VERSION = 'v1.0';

/* ============================================================
   SIGN-IN (Microsoft Entra / MSAL)
   ------------------------------------------------------------
   Pins sign-in to the CorroHealth tenant, so only Corro accounts
   can authenticate. The library is loaded via the <script> tag in
   <head> (shared/msal-browser.min.js). If MSAL isn't present the
   hub still renders — the Sign in button just won't do anything.
   ============================================================ */
const AUTH = {
  clientId : '7a82c6f1-f8ba-464c-b461-d22cce20f099',   // your app registration (Application/client ID)
  tenantId : '683d57e7-70bf-4bc4-b88d-bd8905a0c39a',   // CorroHealth tenant — restricts sign-in to Corro accounts
  // Delegated Graph scopes requested at sign-in. 'User.Read' is enough to sign in and identify
  // the user. To gate tiles by group membership (GROUP_GATES below), add a scope that permits the
  // membership check — typically 'Directory.Read.All' or 'GroupMember.Read.All', admin-consented
  // once in the app registration.
  scopes   : ['User.Read', 'Directory.Read.All'],
};

/* ============================================================
   ADMIN GATES (optional) — lock a tile until the signed-in user
   is a member of a specific Entra security group.
   ------------------------------------------------------------
   Empty = every tile is visible to any signed-in Corro user.
   To enable: 1) paste a group's OBJECT ID below under a key,
              2) add `gate: '<that key>'` to any tool in TOOLS,
              3) add 'Directory.Read.All' to AUTH.scopes above.
   A gated tile shows a padlock and isn't clickable until the
   signed-in user is verified (via Graph) as a group member.
   NOTE: this controls VISIBILITY (a soft/UX gate). The real
   protection is each tool's own sign-in + least-privilege Graph
   permissions — the hub gate is not a security boundary on its own.
   ============================================================ */
const GROUP_GATES = {
  admin: 'faf57959-3e0b-4585-b678-57a1427be267',   // CorroHealth admin security group (Object ID)
};

const TOOLS = [

  {
    section : 'Device Management',
    name    : 'Stale Device Cleanup',
    desc    : 'Find inactive Entra ID devices and disable or delete them. Dry-run by default, with an auto-exported CSV record of every run.',
    icon    : 'device',
    tint    : 't-purple',
    status  : 'live',
    auth    : true,
    gate    : 'admin',
    url     : 'device-cleanup/',
  },

  {
    section : 'User Management',
    name    : 'User Provisioning Wizard',
    desc    : 'Create Entra ID users, assign licenses, and add group memberships for Domestic (US) and Global / India onboarding. Skips existing users and logs every run.',
    icon    : 'userplus',
    tint    : 't-magenta',
    status  : 'live',
    auth    : true,
    gate    : 'admin',
    url     : 'user-provisioning/',
  },

  {
    section : 'Procurement',
    name    : 'PO Builder',
    desc    : 'Turn vendor quote PDFs into Corrohealth-formatted purchase orders. Drop in a Softchoice, SAS, Sonar, Smartsheet, or FastSpring quote and get a signed-ready xlsx with vendor info, line items, tax, and totals filled in.',
    icon    : 'dollar',
    tint    : 't-gold',
    status  : 'live',
    url     : 'po-builder/',
  },

  // Add one object per tool. Copy the template below, uncomment it, and fill it in.
  // {
  //   section : 'Daily Operations',   // heading this tile sits under (new names create new sections)
  //   name    : 'My Tool Name',
  //   desc    : 'One or two sentences describing what the tool does.',
  //   icon    : 'grid',               // key from the ICONS object below
  //   tint    : 't-purple',           // t-purple | t-magenta | t-gold | t-plum | t-wine | t-brand
  //   status  : 'live',               // live | updating | down | beta | soon
  //   auth    : true,                 // true shows the padlock (sign-in required); omit or false to hide
  //   url     : 'my-tool/',           // relative path to the tool's folder in this repo
  // },

];

/* Inline icon set — 24x24 stroke glyphs */
const ICONS = {
  users:   '<path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>',
  userplus:'<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><line x1="19" y1="8" x2="19" y2="14"/><line x1="22" y1="11" x2="16" y2="11"/>',
  search:  '<circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>',
  bar:     '<line x1="12" y1="20" x2="12" y2="10"/><line x1="18" y1="20" x2="18" y2="4"/><line x1="6" y1="20" x2="6" y2="16"/>',
  shield:  '<path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>',
  guest:   '<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><line x1="17" y1="11" x2="23" y2="11"/>',
  wallet:  '<path d="M21 12V7H5a2 2 0 0 1 0-4h14v4"/><path d="M3 5v14a2 2 0 0 0 2 2h16v-5"/><path d="M18 12a2 2 0 0 0 0 4h4v-4z"/>',
  grid:    '<rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/>',
  device:  '<rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/>',
  dollar:  '<line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/>',
};

const LOCK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>';

/* ---- Render ---- */
function svgWrap(inner){
  return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">'+inner+'</svg>';
}

function render(){
  const order = [];
  const groups = {};
  TOOLS.forEach(t => {
    if(!groups[t.section]){ groups[t.section] = []; order.push(t.section); }
    groups[t.section].push(t);
  });

  const host = document.getElementById('sections');

  if(!TOOLS.length){
    host.innerHTML = `
      <section class="section">
        <div class="empty">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/></svg>
          <h3>No tools yet</h3>
          <p>Add your first tool to the <code>TOOLS</code> array in this file and it will appear here as a tile.</p>
        </div>
      </section>`;
    document.getElementById('counterText').textContent = '0 tools · 0 active';
    return;
  }

  host.innerHTML = order.map(sec => {
    const cards = groups[sec].map(t => {
      const locked = t.gate && !unlockedGates.has(t.gate);
      const showLock = locked || t.auth;
      const inner = `
        <div class="ico ${t.tint}">${svgWrap(ICONS[t.icon] || ICONS.grid)}</div>
        <h3>${t.name}</h3>
        <p>${t.desc}</p>
        <div class="foot">
          ${showLock ? `<span class="lock" title="${locked ? 'Requires access — sign in as an authorized user' : 'Sign-in required'}">${LOCK}</span>` : ''}
          <span class="status ${t.status}"><span class="dot"></span>${t.status}</span>
        </div>`;
      return locked
        ? `<div class="card locked">${inner}</div>`
        : `<a class="card" href="${t.url || '#'}">${inner}</a>`;
    }).join('');
    return `<section class="section"><div class="eyebrow">${sec}</div><div class="grid">${cards}</div></section>`;
  }).join('');

  const total = TOOLS.length;
  const active = TOOLS.filter(t => ['live', 'updating', 'beta'].includes(t.status)).length;
  document.getElementById('counterText').textContent = `${total} tool${total === 1 ? '' : 's'} · ${active} active`;

  // Access notice: signed in, but a member of none of the gated groups (all gated tiles locked)
  const notice = document.getElementById('accessNotice');
  const gatedLockedExist = TOOLS.some(t => t.gate && !unlockedGates.has(t.gate));
  if(account && gatedLockedExist && unlockedGates.size === 0){
    document.getElementById('accessNoticeText').innerHTML =
      `You're signed in as <strong>${account.name || account.username || 'your account'}</strong>, but your account isn't in the group required for the padlocked tools. Contact IT to request access.`;
    notice.style.display = 'flex';
  } else {
    notice.style.display = 'none';
  }
}

/* ---- Theme ---- */
const SUN = '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>';
const MOON = '<path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>';

function setTheme(mode){
  document.documentElement.setAttribute('data-theme', mode);
  document.getElementById('themeIcon').innerHTML = mode === 'dark' ? MOON : SUN;
  try { localStorage.setItem('corro-hub-theme', mode); } catch(e){}
}

document.getElementById('themeBtn').addEventListener('click', () => {
  const next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
  setTheme(next);
});

/* ---- Sign-in (MSAL) ---- */
let pca = null;
let account = null;
let unlockedGates = new Set();

function initials(name){
  return (name || '').split(' ').map(w => w[0]).filter(Boolean).join('').slice(0,2).toUpperCase() || 'ME';
}

function updateAuthUI(){
  const signInBtn = document.getElementById('signInBtn');
  const chip = document.getElementById('accountChip');
  if(account){
    const name = account.name || account.username || '';
    signInBtn.style.display = 'none';
    chip.style.display = 'flex';
    document.getElementById('acctInitials').textContent = initials(name);
    document.getElementById('acctName').textContent = name;
  } else {
    signInBtn.style.display = '';
    chip.style.display = 'none';
  }
}

async function getToken(){
  const req = { scopes: AUTH.scopes, account };
  try { return (await pca.acquireTokenSilent(req)).accessToken; }
  catch(_) { return (await pca.acquireTokenPopup(req)).accessToken; }
}

async function runGateChecks(){
  const keys = Object.keys(GROUP_GATES);
  if(!keys.length){ unlockedGates = new Set(); return; }
  try {
    const token = await getToken();
    const ids = keys.map(k => GROUP_GATES[k]);
    const res = await fetch('https://graph.microsoft.com/v1.0/me/checkMemberObjects', {
      method:'POST',
      headers:{ Authorization:'Bearer '+token, 'Content-Type':'application/json' },
      body: JSON.stringify({ ids }),
    });
    if(res.ok){
      const member = (await res.json()).value || [];
      unlockedGates = new Set(keys.filter(k => member.includes(GROUP_GATES[k])));
    }
  } catch(e){ console.warn('Gate check failed:', e); }
}

async function afterSignIn(){
  updateAuthUI();
  await runGateChecks();
  render();
}

async function authInit(){
  const redirectUri = window.location.href.split('#')[0].split('?')[0];
  console.info('%c[Hub] Redirect URI to register  (App registration → Authentication → Single-page application):\n       ' + redirectUri, 'font-weight:bold;color:#e7b524');
  if(typeof msal === 'undefined'){ console.warn('[Hub] MSAL library not loaded — add shared/msal-browser.min.js to the repo. Sign-in is disabled until then.'); return; }
  try {
    pca = new msal.PublicClientApplication({
      auth: {
        clientId: AUTH.clientId,
        authority: 'https://login.microsoftonline.com/' + AUTH.tenantId,
        redirectUri,
      },
      cache: { cacheLocation: 'localStorage' },
    });
    if(pca.initialize) await pca.initialize();          // required by MSAL v3+, harmless on v2
    const accts = pca.getAllAccounts();
    if(accts.length){ account = accts[0]; pca.setActiveAccount(account); await afterSignIn(); }
  } catch(e){ console.warn('Auth init failed:', e); }
}

async function signIn(){
  if(!pca){ return; }
  const btn = document.getElementById('signInBtn');
  btn.classList.add('loading');
  try {
    const res = await pca.loginPopup({ scopes: AUTH.scopes });
    account = res.account; pca.setActiveAccount(account);
    await afterSignIn();
  } catch(e){ console.warn('Sign-in cancelled or failed:', e); }
  finally { btn.classList.remove('loading'); }
}

async function signOut(){
  if(!pca || !account) return;
  try { await pca.logoutPopup({ account }); } catch(_){}
  account = null; unlockedGates = new Set();
  updateAuthUI(); render();
}

document.getElementById('signInBtn').addEventListener('click', signIn);
document.getElementById('signOutBtn').addEventListener('click', signOut);

(function init(){
  let saved = 'dark';
  try { saved = localStorage.getItem('corro-hub-theme') || 'dark'; } catch(e){}
  setTheme(saved);
  document.getElementById('version').textContent = VERSION;
  document.getElementById('year').textContent = new Date().getFullYear();
  render();
  authInit();
})();
</script>
</body>
</html>
