<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CorroHealth · Power Tools for IT</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  /* ============================================================
     CorroHealth Tools Hub
     Brand palette (from CorroColors):
       Eminence Purple  #512e6e   (primary)
       Deep Magenta     #5e174d   (secondary)
       Gold             #e7b524   (accent)
       Logo gradient    lime -> teal -> purple
     ============================================================ */

  :root {
    --brand-purple: #512e6e;
    --brand-magenta: #5e174d;
    --brand-gold: #e7b524;
    --grad-lime: #9ccb3b;
    --grad-teal: #35b6b6;
    --grad-purple: #5b2d86;
  }

  html[data-theme="dark"] {
    --bg: #140d1e;
    --bg-glow: #1e1230;
    --surface: #1e1630;
    --surface-2: #251b3a;
    --surface-hover: #2b2044;
    --border: #342747;
    --border-soft: #2a2040;
    --text: #f3eefb;
    --text-muted: #a99cc0;
    --text-faint: #7d7196;
    --btn-face: #2a1f42;
  }

  html[data-theme="light"] {
    --bg: #f6f3fa;
    --bg-glow: #efe8f6;
    --surface: #ffffff;
    --surface-2: #faf7fd;
    --surface-hover: #f3eef9;
    --border: #e4dcef;
    --border-soft: #ece5f4;
    --text: #241633;
    --text-muted: #6a5c80;
    --text-faint: #948aa6;
    --btn-face: #ffffff;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Inter', system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
    position: relative;
    overflow-x: hidden;
    transition: background .35s ease, color .35s ease;
  }

  .shell { max-width: 1180px; margin: 0 auto; padding: 0 28px; }

  /* ---------- Top bar ---------- */
  header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 22px 0 26px;
  }
  .brand { display: flex; align-items: center; gap: 13px; }
  .brand .mark { width: 52px; height: 40px; flex-shrink: 0; object-fit: contain; }
  .brand-text { display: flex; align-items: baseline; gap: 10px; }
  .brand-text .name {
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 600; font-size: 20px; letter-spacing: -0.01em;
    color: var(--text);
  }
  .brand-text .tag {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10.5px; letter-spacing: .06em; text-transform: uppercase;
    color: var(--text-muted);
    border: 1px solid var(--border);
    padding: 3px 8px; border-radius: 6px;
  }

  .top-actions { display: flex; align-items: center; gap: 10px; }
  .icon-btn {
    width: 38px; height: 38px; border-radius: 9px;
    border: 1px solid var(--border);
    background: var(--btn-face);
    color: var(--text-muted);
    display: grid; place-items: center; cursor: pointer;
    transition: all .2s ease;
  }
  .icon-btn:hover { color: var(--text); border-color: var(--brand-gold); }
  .signin {
    display: inline-flex; align-items: center; gap: 9px;
    font-family: 'Inter', sans-serif; font-size: 14px; font-weight: 500;
    color: #fff;
    background: linear-gradient(135deg, var(--brand-purple), var(--brand-magenta));
    border: none; padding: 10px 18px; border-radius: 9px; cursor: pointer;
    transition: transform .15s ease, box-shadow .2s ease;
    box-shadow: 0 4px 18px -6px rgba(81,46,110,.7);
  }
  .signin:hover { transform: translateY(-1px); box-shadow: 0 8px 24px -6px rgba(81,46,110,.85); }
  .signin svg { width: 16px; height: 16px; }

  /* ---------- Hero ---------- */
  .hero {
    display: flex; align-items: flex-end; justify-content: space-between;
    gap: 30px; padding: 30px 0 46px;
    border-bottom: 1px solid var(--border-soft);
    flex-wrap: wrap;
  }
  .hero h1 {
    font-family: 'Space Grotesk', sans-serif;
    font-size: clamp(34px, 5vw, 52px); font-weight: 600;
    letter-spacing: -0.025em; line-height: 1.02;
  }
  .hero h1 .accent {
    background: linear-gradient(100deg, var(--grad-lime), var(--grad-teal) 45%, var(--brand-purple));
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .hero p {
    color: var(--text-muted); font-size: 15px; max-width: 560px; margin-top: 14px;
  }
  .counter {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12.5px; color: var(--text-muted);
    border: 1px solid var(--border);
    border-radius: 999px; padding: 8px 15px;
    display: inline-flex; align-items: center; gap: 9px;
    white-space: nowrap; background: var(--surface);
  }
  .counter .live-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--grad-lime); box-shadow: 0 0 0 3px rgba(156,203,59,.18); }

  /* ---------- Sections ---------- */
  .section { padding: 40px 0 4px; }
  .eyebrow {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 15px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase;
    color: var(--text); margin-bottom: 20px;
    display: flex; align-items: center; gap: 14px;
  }
  .eyebrow::after { content: ""; flex: 1; height: 1px; background: var(--border-soft); }

  .grid {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px;
  }

  /* ---------- Tool card ---------- */
  .card {
    position: relative;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px; padding: 22px 22px 18px;
    cursor: pointer; text-decoration: none; color: inherit;
    display: flex; flex-direction: column; min-height: 176px;
    transition: transform .18s ease, border-color .18s ease, background .18s ease;
    overflow: hidden;
  }
  .card::before {
    content: ""; position: absolute; inset: 0;
    background: radial-gradient(420px 160px at 100% 0%, rgba(231,181,36,.07), transparent 60%);
    opacity: 0; transition: opacity .25s ease;
  }
  .card:hover { transform: translateY(-3px); border-color: var(--brand-gold); background: var(--surface-hover); }
  .card:hover::before { opacity: 1; }
  .card:focus-visible { outline: 2px solid var(--brand-gold); outline-offset: 2px; }

  .card .ico {
    width: 44px; height: 44px; border-radius: 12px;
    display: grid; place-items: center; margin-bottom: 16px;
    color: #fff;
  }
  .card .ico svg { width: 22px; height: 22px; }
  .card h3 {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 17px; font-weight: 600; letter-spacing: -0.01em; margin-bottom: 8px;
  }
  .card p { font-size: 13px; color: var(--text-muted); line-height: 1.55; flex: 1; }

  .card .foot {
    display: flex; align-items: center; justify-content: space-between;
    margin-top: 16px;
  }
  .lock { color: var(--text-faint); display: inline-flex; }
  .lock svg { width: 15px; height: 15px; }
  .status {
    font-family: 'JetBrains Mono', monospace; font-size: 11px;
    display: inline-flex; align-items: center; gap: 6px; letter-spacing: .02em;
    margin-left: auto;
  }
  .status .dot { width: 6px; height: 6px; border-radius: 50%; }
  .status.live { color: var(--grad-lime); }
  .status.live .dot { background: var(--grad-lime); }
  .status.beta { color: var(--brand-gold); }
  .status.beta .dot { background: var(--brand-gold); }
  .status.soon { color: var(--text-faint); }
  .status.soon .dot { background: var(--text-faint); }

  /* icon tints */
  .t-purple { background: linear-gradient(135deg, #6b3d92, #512e6e); }
  .t-magenta{ background: linear-gradient(135deg, #7a2263, #5e174d); }
  .t-gold   { background: linear-gradient(135deg, #f0c94b, #cf9e15); color:#3a2b04 !important; }
  .t-teal   { background: linear-gradient(135deg, #45c7c7, #2f8f8f); }
  .t-lime   { background: linear-gradient(135deg, #a9d84a, #7fae2f); color:#20320a !important; }
  .t-brand  { background: linear-gradient(135deg, var(--grad-lime), var(--grad-teal) 55%, var(--brand-purple)); }

  /* ---------- Empty state ---------- */
  .empty {
    border: 1px dashed var(--border);
    border-radius: 16px;
    padding: 52px 28px; text-align: center;
    background: var(--surface);
  }
  .empty svg { width: 40px; height: 40px; color: var(--text-faint); margin-bottom: 16px; }
  .empty h3 {
    font-family: 'Space Grotesk', sans-serif; font-size: 18px; font-weight: 600;
    margin-bottom: 8px;
  }
  .empty p { color: var(--text-muted); font-size: 14px; max-width: 380px; margin: 0 auto; }
  .empty code {
    font-family: 'JetBrains Mono', monospace; font-size: 12.5px;
    background: var(--surface-2); border: 1px solid var(--border-soft);
    padding: 2px 6px; border-radius: 5px; color: var(--brand-gold);
  }

  /* ---------- Setup / footer strip ---------- */
  .setup {
    margin: 46px 0 30px; background: var(--surface);
    border: 1px solid var(--border); border-radius: 16px; overflow: hidden;
  }
  .setup summary {
    list-style: none; cursor: pointer; padding: 18px 22px;
    display: flex; align-items: center; gap: 11px;
    font-family: 'Space Grotesk', sans-serif; font-weight: 600; font-size: 15px;
  }
  .setup summary::-webkit-details-marker { display: none; }
  .setup summary .chev { margin-left: auto; color: var(--text-faint); transition: transform .2s ease; }
  .setup[open] summary .chev { transform: rotate(180deg); }
  .setup .body { padding: 0 22px 22px; color: var(--text-muted); font-size: 14px; }
  .setup .body code {
    font-family: 'JetBrains Mono', monospace; font-size: 12.5px;
    background: var(--surface-2); border: 1px solid var(--border-soft);
    padding: 2px 6px; border-radius: 5px; color: var(--brand-gold);
  }
  .setup .body ol { margin: 10px 0 0 18px; display: grid; gap: 8px; }

  footer {
    text-align: center; color: var(--text-faint); font-size: 12.5px;
    padding: 24px 0 42px;
    font-family: 'JetBrains Mono', monospace;
  }

  /* ---------- Responsive ---------- */
  @media (max-width: 900px) { .grid { grid-template-columns: repeat(2, 1fr); } }
  @media (max-width: 620px) {
    .shell { padding: 0 18px; }
    .grid { grid-template-columns: 1fr; }
    .brand-text .tag { display: none; }
    .signin span { display: none; }
    .hero { padding-bottom: 34px; }
  }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; animation: none !important; }
  }
</style>
</head>

<script>

const TOOLS = [

  {
    section : 'Device Management',
    name    : 'Stale Device Cleanup',

const ICONS = {

/* ---- Render ---- */
function svgWrap(inner){
  return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">'+inner+'</svg>';
}

function render(){
  const order = [];
  const groups = {};
  TOOLS.forEach(t => {
    if(!groups[t.section]){ groups[t.section] = []; order.push(t.section); }
    groups[t.section].push(t);
  });

  const host = document.getElementById('sections');

  if(!TOOLS.length){
    host.innerHTML = `
      <section class="section">
        <div class="empty">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/></svg>

        </div>
      </section>`;
    document.getElementById('counterText').textContent = '0 tools · 0 active';
    return;
  }

  host.innerHTML = order.map(sec => {
    const cards = groups[sec].map(t => `
      <a class="card" href="${t.url || '#'}">
        <div class="ico ${t.tint}">${svgWrap(ICONS[t.icon] || ICONS.grid)}</div>
        <h3>${t.name}</h3>
        <p>${t.desc}</p>
        <div class="foot">
          ${t.auth ? `<span class="lock" title="Sign-in required">${LOCK}</span>` : ''}
          <span class="status ${t.status}"><span class="dot"></span>${t.status}</span>
        </div>
      </a>`).join('');
    return `<section class="section"><div class="eyebrow">${sec}</div><div class="grid">${cards}</div></section>`;
  }).join('');

  const total = TOOLS.length;
  const active = TOOLS.filter(t => t.status === 'live' || t.status === 'beta').length;
  document.getElementById('counterText').textContent = `${total} tool${total === 1 ? '' : 's'} · ${active} active`;
}

/* ---- Theme ---- */
const SUN = '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>';
const MOON = '<path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>';

function setTheme(mode){
  document.documentElement.setAttribute('data-theme', mode);
  document.getElementById('themeIcon').innerHTML = mode === 'dark' ? MOON : SUN;
  try { localStorage.setItem('corro-hub-theme', mode); } catch(e){}
}

document.getElementById('themeBtn').addEventListener('click', () => {
  const next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
  setTheme(next);
});

(function init(){
  let saved = 'dark';
  try { saved = localStorage.getItem('corro-hub-theme') || 'dark'; } catch(e){}
  setTheme(saved);
  document.getElementById('year').textContent = new Date().getFullYear();
  render();
})();
</script>
</body>
